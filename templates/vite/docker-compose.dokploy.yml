# Dokploy / Coolify / generic Compose host
#
# The platform builds this file from the repo. Set env vars in the platform
# Environment tab and routing in the Domains tab (service web, port 8080).
# No Traefik labels here: the platform generates them.
# MySQL is external.
#
# Local: docker compose build && docker compose up -d
#        (docker-compose.override.yml publishes 127.0.0.1:8080)

name: {{PROJECT_NAME}}

x-app-user: &app-user
  HOST_UID: ${HOST_UID:-${UID:-0}}
  HOST_GID: ${HOST_GID:-${GID:-0}}

services:
  web:
    image: ${APP_IMAGE:-{{PROJECT_NAME}}:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    expose:
      - "8080"
    environment:
      <<: *app-user
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      DEV_BYPASS_AUTH: "false"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
